name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run lint, format, tests, and chaos evals
        run: |
          uv sync --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -v
          uv run sidefx eval

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Build and verify sdist and wheel install
        run: |
          uv build
          uv venv /tmp/sidefx-smoke-venv
          uv pip install --python /tmp/sidefx-smoke-venv/bin/python dist/*.whl
          /tmp/sidefx-smoke-venv/bin/sidefx --version
          /tmp/sidefx-smoke-venv/bin/sidefx doctor --json
          /tmp/sidefx-smoke-venv/bin/python -m sidefx --version
