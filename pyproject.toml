[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sidefx"
version = "0.1.1"
description = "Outbound effects journal, transparent stdio MCP proxy, CLI mutation wrapper, crash reconciler, and ground-truth session receipts for AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Solomon Wakhungu" },
]
keywords = [
    "ai-agents",
    "mcp",
    "model-context-protocol",
    "idempotency",
    "sqlite",
    "journal",
    "cli",
    "safety",
    "claude-code",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/1solomonwakhungu/sidefx"
Repository = "https://github.com/1solomonwakhungu/sidefx"
Issues = "https://github.com/1solomonwakhungu/sidefx/issues"
Documentation = "https://github.com/1solomonwakhungu/sidefx#readme"

[project.scripts]
sidefx = "sidefx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sidefx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
